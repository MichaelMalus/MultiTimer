<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiTimer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MultiTimer</h1>
  <div class="actions">
    <button id="start" title="Start a new top-level topic (N)">▶ New topic</button>
    <button id="tangent" class="primary" title="Start a tangent under the current timer (T)">↳ Tangent!</button>
    <button id="back" title="Stop the current timer and return to its parent (B)">↩ Back on topic</button>
  </div>
</header>
<main>
  <section>
    <h2>Running <span id="running-count" class="count"></span></h2>
    <ul id="running" class="tree"></ul>
    <p id="empty" class="hint">No running timers. Press <kbd>N</kbd> to start a topic, <kbd>T</kbd> when the conversation drifts, <kbd>B</kbd> when it comes back. Name things later.</p>
  </section>
  <details id="completed-wrap">
    <summary>Completed <span id="completed-count" class="count"></span></summary>
    <ul id="completed" class="tree"></ul>
    <button id="clear" class="danger small">Delete all completed</button>
  </details>
</main>
<script src="app.js"></script>
</body>
</html>
